# Reusable release pipeline for Noctívago plugins. A plugin repo calls it
# from its own workflow on a tag push (see README.md, "Automatic releases"):
#
#   on:
#     push:
#       tags: ['*']
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: Venari-Hunt/noctivago-plugins/.github/workflows/plugin-release.yml@main
#
# It builds and tests the plugin (npm ci, npm run build, npm test, when there's a package.json),
# checks the tag, manifest.json and versions.json agree, and publishes a
# GitHub Release with manifest.json and every file the manifest names as
# assets. The app installs from exactly those assets.
name: Plugin release
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build --if-present
            npm test --if-present
          fi
      - uses: actions/checkout@v4
        with:
          repository: Venari-Hunt/noctivago-plugins
          path: .noctivago-plugins
      - name: Check manifest, tag and versions.json
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node .noctivago-plugins/scripts/check-plugin.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TAG" --generate-notes
          fi
